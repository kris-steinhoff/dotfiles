repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: detect-private-key
  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        args: [--force-exclude]
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write
        language: node
        additional_dependencies: ["prettier@3.3.3"]
        types: [markdown]
      - id: sort-claude-settings-json
        name: check Claude settings.json keys are sorted
        entry: >-
          sh -c 'for f in "$@"; do out=$(chezmoi execute-template <"$f") && [ "$out" = "$(printf "%s\n" "$out" | jq -S .)" ] || { echo "$f: keys not in jq -S order"; exit 1; }; done' --
        language: system
        files: ^\.chezmoitemplates/claude-settings\.json\.tmpl$
